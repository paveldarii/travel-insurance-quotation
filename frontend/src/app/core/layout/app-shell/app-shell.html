<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/quotes" aria-label="Quotation home">
      <span class="brand__mark" aria-hidden="true"> I </span>

      <span>InsuranceOne</span>
    </a>

    <nav class="main-navigation" aria-label="Main navigation">
      <a
        routerLink="/quotes"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{
          exact: true,
        }"
      >
        My quotes
      </a>

      <a routerLink="/quotes/new" routerLinkActive="is-active"> New quote </a>
    </nav>

    <div class="user-menu">
      <div class="user-menu__identity">
        <strong>
          {{ authService.currentUser()?.name }}
        </strong>

        <span>
          {{ authService.currentUser()?.email }}
        </span>
      </div>

      <button type="button" class="logout-button" (click)="logout()">Log out</button>
    </div>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
